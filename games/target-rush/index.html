
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Target Rush</title>
<style>
:root {
  --bg: #0b1020;
  --panel: #151e32;
  --blue: #55a8ff;
  --text: #f4f7ff;
  --muted: #9eacc5;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(ellipse at top, #1b3155, var(--bg) 65%);
  color: var(--text);
  font-family: system-ui, Arial, sans-serif;
  padding: 24px 16px;
}
.container { max-width: 950px; margin: auto; }
header { text-align: center; margin-bottom: 22px; }
h1 {
  margin: 0;
  font-size: clamp(2.5rem, 8vw, 4.5rem);
  font-weight: 950;
  letter-spacing: -3px;
  font-style: italic;
}
h1 span { color: var(--blue); }
.subtitle { color: var(--muted); margin-top: 4px; }
.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 14px;
}
.stat {
  background: var(--panel);
  border: 1px solid #2a3a57;
  padding: 13px 8px;
  border-radius: 14px;
  text-align: center;
}
.stat-label {
  font-size: .7rem;
  color: var(--muted);
  font-weight: 800;
  letter-spacing: 1px;
}
.stat-value { font-size: clamp(1.2rem, 4vw, 1.8rem); font-weight: 900; }
#timer { color: #70e5a3; }
#combo { color: #ffcc67; }
.arena {
  height: 410px;
  position: relative;
  overflow: hidden;
  border: 2px solid #304769;
  border-radius: 20px;
  background:
    linear-gradient(#263e5a22 1px, transparent 1px),
    linear-gradient(90deg, #263e5a22 1px, transparent 1px),
    #101a2c;
  background-size: 28px 28px;
  box-shadow: 0 18px 45px #0005;
  touch-action: manipulation;
}
#target {
  position: absolute;
  display: none;
  width: 58px;
  height: 58px;
  border: 5px solid #fff;
  border-radius: 50%;
  cursor: pointer;
  background: radial-gradient(circle, #fff 0 12%, #ff626e 14% 42%, #d9274c 44% 70%, #fff 72%);
  box-shadow: 0 0 20px #ff435988;
  transform: translate(-50%, -50%);
  transition: width .12s, height .12s;
  padding: 0;
  z-index: 2;
  touch-action: manipulation;
}
#target.gold {
  background: radial-gradient(circle, white 0 12%, #ffe993 14% 42%, #ffb51b 44% 70%, white 72%);
  box-shadow: 0 0 28px #ffc33dcc;
  border-color: #fff6cb;
}
#target:active { filter: brightness(1.3); }
#overlay {
  position: absolute;
  inset: 0;
  z-index: 5;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px;
  background: #0b1020df;
}
#overlay h2 { font-size: clamp(2rem, 7vw, 3.4rem); margin: 0 0 8px; }
#overlay p { color: var(--muted); max-width: 390px; line-height: 1.6; }
button.action {
  border: 0;
  border-radius: 11px;
  background: var(--blue);
  color: #071426;
  font-size: 1rem;
  font-weight: 900;
  padding: 14px 27px;
  cursor: pointer;
  box-shadow: 0 5px 0 #2674c1;
}
button.action:hover { filter: brightness(1.1); }
button.action:active { transform: translateY(2px); box-shadow: 0 3px 0 #2674c1; }
#message {
  position: absolute;
  z-index: 4;
  top: 20%;
  left: 50%;
  transform: translateX(-50%);
  font-weight: 1000;
  font-size: clamp(1.5rem, 5vw, 2.6rem);
  color: #ffcf64;
  text-shadow: 0 3px 18px #000;
  pointer-events: none;
  text-align: center;
  white-space: nowrap;
}
#feedback {
  position: absolute;
  z-index: 3;
  font-size: 1.2rem;
  font-weight: 950;
  color: #fff;
  text-shadow: 0 2px 10px #000;
  pointer-events: none;
  animation: floatUp .65s ease-out forwards;
}
@keyframes floatUp {
  from { opacity: 1; transform: translate(-50%, 0) scale(.8); }
  to { opacity: 0; transform: translate(-50%, -48px) scale(1.2); }
}
.instructions {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px 22px;
  margin: 18px 0;
  color: var(--muted);
  font-size: .85rem;
}
.instructions strong { color: var(--text); }
footer { text-align: center; color: #71819d; font-size: .8rem; margin-top: 20px; }
@media (max-width: 540px) {
  body { padding: 18px 10px; }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .arena { height: 390px; }
  h1 { letter-spacing: -2px; }
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>TARGET <span>RUSH</span></h1>
    <div class="subtitle">Lock in. Hit targets. Beat your record.</div>
  </header>

  <section class="stats">
    <div class="stat">
      <div class="stat-label">SCORE</div>
      <div class="stat-value" id="score">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">TIME LEFT</div>
      <div class="stat-value" id="timer">30.0</div>
    </div>
    <div class="stat">
      <div class="stat-label">COMBO</div>
      <div class="stat-value" id="combo">1×</div>
    </div>
    <div class="stat">
      <div class="stat-label">PERSONAL BEST</div>
      <div class="stat-value" id="best">0</div>
    </div>
  </section>

  <main class="arena" id="arena">
    <button id="target" aria-label="Hit target"></button>
    <div id="message"></div>
    <div id="overlay">
      <h2 id="overlayTitle">READY?</h2>
      <p id="overlayText">You have 30 seconds. Hit targets, build combos, and watch for rare Gold Targets!</p>
      <button class="action" id="startBtn">START GAME</button>
    </div>
  </main>

  <div class="instructions">
    <span>🎯 <strong>Red:</strong> Normal target</span>
    <span>⭐ <strong>Gold:</strong> Double points</span>
    <span>⚡ <strong>Combo:</strong> Hit quickly</span>
  </div>
  <footer>Target Rush · V7 · Every hit counts</footer>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const arena = $("arena");
  const target = $("target");
  const overlay = $("overlay");
  const message = $("message");
  const startBtn = $("startBtn");

  let score = 0;
  let best = 0;
  let combo = 1;
  let timeLeft = 30;
  let running = false;
  let phase = "ready";
  let countdownId = null;
  let gameEnd = null;
  let spawnId = null;
  let comboId = null;
  let lastHit = 0;
  let targetSize = 58;
  let spawnDelay = 850;
  let gold = false;
  let milestoneSet = new Set();

  try {
    best = Math.max(0, Number(localStorage.getItem("targetRushBest")) || 0);
  } catch (_) {}
  $("best").textContent = best;

  function showMessage(text, duration = 800) {
    message.textContent = text;
    message.animate(
      [{opacity: 0, transform: "translateX(-50%) scale(.7)"},
       {opacity: 1, transform: "translateX(-50%) scale(1)"},
       {opacity: 0, offset: 1}],
      {duration, easing: "ease-out"}
    );
    clearTimeout(showMessage.timeout);
    showMessage.timeout = setTimeout(() => message.textContent = "", duration);
  }

  function updateStats() {
    $("score").textContent = score;
    $("combo").textContent = combo + "×";
    $("best").textContent = best;
    $("timer").textContent = Math.max(0, timeLeft).toFixed(1);
  }

  function stopSpawn() {
    clearTimeout(spawnId);
    spawnId = null;
  }

  function placeTarget() {
    if (!running) return;
    const bounds = arena.getBoundingClientRect();
    const margin = targetSize / 2 + 8;
    const x = margin + Math.random() * Math.max(1, bounds.width - margin * 2);
    const y = margin + Math.random() * Math.max(1, bounds.height - margin * 2);
    target.style.left = x + "px";
    target.style.top = y + "px";
    target.style.width = targetSize + "px";
    target.style.height = targetSize + "px";

    gold = Math.random() < 0.09;
    target.classList.toggle("gold", gold);
    target.style.display = "block";
  }

  function scheduleSpawn() {
    stopSpawn();
    if (!running) return;
    spawnId = setTimeout(() => {
      placeTarget();
      scheduleSpawn();
    }, spawnDelay);
  }

  function startGame() {
    clearInterval(countdownId);
    clearInterval(gameEnd);
    stopSpawn();
    clearTimeout(comboId);

    score = 0;
    combo = 1;
    timeLeft = 30;
    targetSize = 58;
    spawnDelay = 850;
    lastHit = 0;
    milestoneSet = new Set();
    running = false;
    phase = "countdown";
    target.style.display = "none";
    overlay.style.display = "none";
    message.textContent = "";
    updateStats();

    let count = 3;
    showMessage("3", 750);
    countdownId = setInterval(() => {
      count--;
      if (count > 0) {
        showMessage(String(count), 750);
      } else if (count === 0) {
        showMessage("GO!", 500);
        running = true;
        phase = "playing";
        timeLeft = 30;
        updateStats();
        placeTarget();
        scheduleSpawn();
        const startTime = Date.now();
        gameEnd = setInterval(() => {
          timeLeft = Math.max(0, 30 - (Date.now() - startTime) / 1000);
          updateStats();
          if (timeLeft <= 0) endGame();
        }, 50);
      } else {
        clearInterval(countdownId);
      }
    }, 1000);
  }

  function checkMilestones() {
    const milestones = [
      [10, "NICE!"],
      [25, "ON FIRE!"],
      [50, "AMAZING!"],
      [100, "UNSTOPPABLE!"]
    ];
    for (const [points, text] of milestones) {
      if (score >= points && !milestoneSet.has(points)) {
        milestoneSet.add(points);
        showMessage(text, 1300);
      }
    }
  }

  function hitTarget(event) {
    if (!running || phase !== "playing") return;
    event.preventDefault();

    const wasGold = gold;
    const now = Date.now();

    if (lastHit && now - lastHit <= 1400) {
      combo = Math.min(combo + 1, 20);
    } else {
      combo = 1;
    }
    lastHit = now;

    clearTimeout(comboId);
    comboId = setTimeout(() => {
      combo = 1;
      updateStats();
    }, 1500);

    const points = combo * (wasGold ? 2 : 1);
    score += points;

    target.style.display = "none";
    const rect = target.getBoundingClientRect();
    const arenaRect = arena.getBoundingClientRect();
    const feedback = document.createElement("div");
    feedback.id = "feedback";
    feedback.textContent = (wasGold ? "GOLD! +" : "+") + points;
    feedback.style.left = (rect.left - arenaRect.left + rect.width / 2) + "px";
    feedback.style.top = (rect.top - arenaRect.top) + "px";
    arena.appendChild(feedback);
    setTimeout(() => feedback.remove(), 700);

    if (combo >= 2) showMessage(combo + "× COMBO!", 450);
    checkMilestones();

    targetSize = Math.max(27, 58 - Math.floor(score / 5) * 2);
    spawnDelay = Math.max(330, 850 - score * 5);
    updateStats();

    stopSpawn();
    placeTarget();
    scheduleSpawn();
  }

  function endGame() {
    if (phase !== "playing") return;
    running = false;
    phase = "over";
    timeLeft = 0;
    clearInterval(gameEnd);
    clearInterval(countdownId);
    stopSpawn();
    clearTimeout(comboId);
    target.style.display = "none";

    const newRecord = score > best;
    if (newRecord) {
      best = score;
      try { localStorage.setItem("targetRushBest", String(best)); } catch (_) {}
    }
    updateStats();

    overlay.style.display = "flex";
    $("overlayTitle").textContent = "TIME'S UP!";
    $("overlayText").innerHTML =
      "Current Score: <strong>" + score + "</strong><br>" +
      "Personal Best: <strong>" + best + "</strong>" +
      (newRecord ? '<br><span style="color:#70e5a3;font-weight:900">🏆 NEW PERSONAL BEST!</span>' : "") +
      "<br>Ready for another round?";
    startBtn.textContent = "PLAY AGAIN";
  }

  target.addEventListener("pointerdown", hitTarget);
  startBtn.addEventListener("click", startGame);

  updateStats();
})();
</script>
</body>
</html>
